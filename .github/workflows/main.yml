name: CI/CD for backend

on:
  push:
    paths:
      - "**"
    branches: [ "feature/backend/cd" ]
  pull_request:
    paths:
      - "**"
    branches: [ "feature/backend/cd" ]

jobs:
  CI-CD:
    runs-on: self-hosted
    env:
      working-directory: ./Backend
      conda-env-name: back_test
    steps:
    # Step 1: Check out the code from GitHub
    - name: Checkout Code
      uses: actions/checkout@v3


    # Step 2: Build the Docker image
    - name: Build Docker Image
      run: |
        docker build -t fastapi-ssh .

    # Step 3: Stop and remove existing container if running
    - name: Stop and Remove Existing Container
      run: |
        docker stop backend || true
        docker rm backend || true

    # Step 4: Run the container with the new image
    - name: Run New Docker Container
      run: |
        docker run -d --name backend -p 8002:8001 fastapi-ssh